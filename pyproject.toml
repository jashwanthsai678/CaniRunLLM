[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canirunllm"
version = "0.1.0"
description = "Find out which open-source LLMs can run on your hardware."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.scripts]
canirunllm = "canirunllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"canirunllm.registry" = ["*.json"]
"canirunllm.web" = ["static/*", "templates/*"]