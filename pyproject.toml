[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canirunllm"
version = "0.1.0"
description = "Find out which open-source LLMs can run on your hardware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "jashwanthsai678" },
]
keywords = ["llm", "local-llm", "hardware", "gguf", "llama.cpp", "quantization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "psutil>=5.9",
    "GPUtil>=1.4",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/jashwanthsai678/CaniRunLLM"
Repository = "https://github.com/jashwanthsai678/CaniRunLLM"
Issues = "https://github.com/jashwanthsai678/CaniRunLLM/issues"

[project.scripts]
canirunllm = "canirunllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"canirunllm.registry" = ["*.json"]
"canirunllm.web" = ["static/*", "templates/*"]