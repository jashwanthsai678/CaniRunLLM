name: Publish release

# Fires when a version tag (e.g. v0.1.2) is pushed. Cutting a release is
# still a deliberate human action - bump the version in pyproject.toml,
# commit, then:
#   git tag v0.1.2
#   git push origin v0.1.2
# That single push builds + publishes to PyPI AND builds + attaches the
# Windows .exe to a GitHub Release, from the same source tree.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches pyproject.toml's version
        id: extract
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PYPROJECT_VERSION}. Bump pyproject.toml first, commit, then tag."
            exit 1
          fi
          echo "version=$PYPROJECT_VERSION" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) - no stored token needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-and-release-exe:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the standalone .exe
        run: |
          pip install -e ".[packaging]"
          pyinstaller packaging/canirunllm.spec --noconfirm --distpath dist_exe --workpath build_exe

      - name: Create GitHub Release and attach the .exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist_exe/CanIRunLLM.exe \
            --title "${{ github.ref_name }}" \
            --generate-notes
